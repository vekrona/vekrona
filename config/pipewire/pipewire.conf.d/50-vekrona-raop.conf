# AirPlay output. pipewire-config-raop loads libpipewire-module-raop-discover without arguments, which makes
# every sink buffer 250 ms; an AirPlay packet holds 352 frames (7.981859 ms at 44100 Hz) and the buffer must be a
# whole number of packets, so PipeWire logs "sess.latency.msec 250.000000 should be an integer multiple of
# rtp.ptime 7.981859" for each sink and rounds the buffer down itself. 247.45 ms is 10912 frames, exactly 31 packets.
# The packaged entry is switched off with its own condition (module.raop) and replaced by this one.
context.properties = {
  module.raop = false
}

context.modules = [
  { name = libpipewire-module-raop-discover
    args = {
      stream.rules = [
        { matches = [ { raop.ip = "~.*" } ]
          actions = {
            create-stream = {
              stream.props = {
                sess.latency.msec = 247.45
              }
            }
          }
        }
      ]
    }
  }
]
