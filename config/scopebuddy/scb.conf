# scopebuddy sources this file as bash. Gamescope runs nested in Sway, so it gets the size and refresh rate (Sway reports mHz) of the output Sway shows it on, whichever machine this is.
if ! output_mode="$(swaymsg -t get_outputs --raw | jq -er '.[] | select(.focused) | .current_mode | "-W \(.width) -H \(.height) -r \((.refresh + 500) / 1000 | floor)"')"; then
  echo "scb.conf: cannot read the focused output's mode from sway" >&2
  exit 1
fi
SCB_GAMESCOPE_ARGS="-f $output_mode"
