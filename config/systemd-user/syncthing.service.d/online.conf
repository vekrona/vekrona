# syncthing starts at boot through linger, before Wi-Fi is up, and its first DNS lookups fail. Wait for NetworkManager
# to report a connection. The leading "-" ignores nm-online's failure: an offline boot (no network, or 60 s without one)
# must still start syncthing, which serves its local GUI and retries its peers.
[Service]
ExecStartPre=-/usr/bin/nm-online -q -t 60
