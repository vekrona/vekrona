# Syncthing's GUI and REST API listen on a unix socket, /run/user/<uid>/syncthing/gui.sock (the address in its config.xml, set
# by stage 50), with no login: the OS user is the authentication. systemd creates the directory for the unit, readable by the
# user alone, so no other user reaches the socket, and removes it when the unit stops.
[Service]
RuntimeDirectory=syncthing
RuntimeDirectoryMode=0700
