# The default sink and source follow the best device that is present, so a USB interface behind a KVM
# (or any hot-plugged card) can come and go without anyone choosing it.
# Order: Scarlett > other USB audio > onboard analog > HDMI > network (AirPlay). The last four are
# WirePlumber's own priorities (USB 1100, analog 1009, HDMI at most 744, a node without one 0); only the
# Scarlett needs a rule.
# Docs: https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/priorities.html

wireplumber.settings = {
  # Without this, whatever was ever chosen by hand outranks the priorities from then on, and a remembered
  # Scarlett or AirPlay choice would keep winning over the device that is actually present.
  node.restore-default-targets = false
  # Streams follow the default; none is pinned to the device it first played on.
  node.stream.restore-target = false
}

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        # A card that appeared while a profile "off" was stored (by a stall, or by hand) comes up usable.
        session.dont-restore-off-profile = true
      }
    }
  }
  {
    # The MS2109 HDMI capture card's audio is not wanted: it offers only pro-audio and would only add noise to the
    # card list and the hot-plug cycles of a flapping port.
    matches = [
      { device.name = "~alsa_card.usb-MACROSILICON.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_(output|input).usb-Focusrite_Scarlett.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]
