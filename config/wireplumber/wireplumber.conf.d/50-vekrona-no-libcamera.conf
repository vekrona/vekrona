# Cameras here are USB (UVC) devices, which the V4L2 monitor serves. The libcamera monitor would enumerate each of them
# a second time (WirePlumber then arbitrates and drops the duplicate), and a device that re-enumerates in a loop, such as
# a flapping capture card behind a KVM, makes it run "Adding camera" on every cycle. libcamera is for MIPI/ISP cameras.
# Supported setting: https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/video.html
# ("set monitor.libcamera = disabled to use V4L2 only").
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
