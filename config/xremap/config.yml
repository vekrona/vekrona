modmap:
  - name: caps-hyper
    remap:
      CapsLock:
        held: [Ctrl_L, Alt_L, Super_L]
        alone: CapsLock
        alone_timeout_millis: 300

keymap:
  - name: cmd-layer
    exact_match: true
    application:
      not: &terminals [com.mitchellh.ghostty, foot, org.wezfurlong.wezterm, vekrona.agent]
    remap:
      Super-a: C-a
      Super-c: C-c
      Super-v: C-v
      Super-x: C-x
      Super-z: C-z
      Super-s: C-s
      Super-f: C-f
      Super-n: C-n
      Super-t: C-t
      Super-w: C-w
      Super-r: C-r
      Super-l: C-l
      Super-p: C-p
      Super-o: C-o
      Super-i: C-i
      Super-k: C-k
      Super-b: C-b
      Super-u: C-u
      Super-d: C-d
      Super-g: C-g
      Super-h: C-h
      Super-j: C-j
      Super-e: C-e
      Super-m: C-m
      Super-y: C-y
      Super-Shift-z: C-Shift-z
      Super-Shift-t: C-Shift-t
      Super-Shift-n: C-Shift-n
      Super-Shift-p: C-Shift-p
      Super-Shift-f: C-Shift-f
      Super-Shift-g: C-Shift-g
      Super-Shift-r: C-Shift-r
      Super-Shift-w: C-Shift-w
      Alt-Left: C-Left
      Alt-Right: C-Right
      Alt-Shift-Left: C-Shift-Left
      Alt-Shift-Right: C-Shift-Right
      Alt-BackSpace: C-BackSpace
      Super-BackSpace: [Shift-Home, BackSpace]
      Super-Shift-LeftBrace: C-PageUp
      Super-Shift-RightBrace: C-PageDown
      Super-comma: C-comma

  - name: terminal
    exact_match: true
    application:
      only: *terminals
    remap:
      Super-c: C-Shift-c
      Super-v: C-Shift-v
      Alt-Left: C-Left
      Alt-Right: C-Right
