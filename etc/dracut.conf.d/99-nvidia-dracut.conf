# vekrona: load nvidia in the initramfs (overrides RPM Fusion's omit) so LUKS prompt and greeter have a display.
# kernel-install runs dracut before akmods@<kver> has built the module, and dracut logs a missing add_drivers module as
# FAILED, so ask for it only once it exists; the akmods@ drop-in runs
# vekrona-kernel-ready, which runs dracut again after the build.
# dracut sets $kernel (the target version) before it sources this file.
if compgen -G "${dracutsysrootdir-}/usr/lib/modules/$kernel/extra/nvidia/nvidia.ko*" > /dev/null; then
    add_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
fi
