# Protocols, filesystems and buses this machine never uses, and that the kernel loads on demand: an unprivileged process can
# make it load one (opening a socket of the family, mounting a crafted image, a FireWire device with DMA) and so reach its code.
# Only modules the Fedora kernel ships are listed (modinfo); tests/stages/test-kernel-hardening.sh fails on one it does not.
# One line per module, nothing else: stage 70 reads the names from the "install" lines.
# FireWire: the OHCI controller can read memory by DMA.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install firewire-net /bin/false
# Network protocols. CAN is built into the Fedora kernel; its protocols are the modules a CAN socket loads.
install sctp /bin/false
install tipc /bin/false
install atm /bin/false
install can_raw /bin/false
install can_bcm /bin/false
install can_isotp /bin/false
install can_j1939 /bin/false
# Filesystems of other systems.
install jffs2 /bin/false
install hfs /bin/false
