# Keys only. sshd takes the first value it reads for a keyword, and "10-" sorts before Fedora's 40-redhat-crypto-policies
# and 50-redhat drop-ins, so these lines win. Reachability is limited to the tailnet by the firewalld "tailnet" zone.
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitRootLogin no
