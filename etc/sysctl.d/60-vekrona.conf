# Read after Fedora's /usr/lib/sysctl.d (10-default-yama-scope.conf sets ptrace_scope 0). Stage 70 reads every setting here back
# with sysctl -n. rp_filter is left alone: Tailscale and ProtonVPN break with strict mode.

# A process may attach to its own children only (gdb, strace and ptrace of a sibling need sudo or a child).
kernel.yama.ptrace_scope = 1
# Kernel addresses stay hidden from everyone, root included.
kernel.kptr_restrict = 2
# dmesg needs sudo; journalctl -k is unaffected.
kernel.dmesg_restrict = 1
# No kexec of another kernel until the next boot.
kernel.kexec_load_disabled = 1
# A line discipline module is not loaded on a process's request.
dev.tty.ldisc_autoload = 0

# No redirects, no source-routed packets: this machine is not a router.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
