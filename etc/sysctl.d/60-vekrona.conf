# Read after Fedora's /usr/lib/sysctl.d (10-default-yama-scope.conf sets ptrace_scope 0). Stage 70 reads every setting here back
# from /proc/sys, each interface for a key with a *. rp_filter is left alone: Tailscale and the WireGuard VPN (vekrona-vpn) break with strict mode.

# A process may attach to its own children only (gdb, strace and ptrace of a sibling need sudo or a child).
kernel.yama.ptrace_scope = 1
# Kernel addresses stay hidden from everyone, root included.
kernel.kptr_restrict = 2
# dmesg needs sudo; journalctl -k is unaffected.
kernel.dmesg_restrict = 1
# No kexec of another kernel until the next boot.
kernel.kexec_load_disabled = 1
# A line discipline module is not loaded on a process's request.
dev.tty.ldisc_autoload = 0

# No redirects, no source-routed packets: this machine is not a router. The * covers "all", "default" and each interface that exists
# when systemd-sysctl runs (an interface that appears later copies "default"). IPv6 has no send_redirects.
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_source_route = 0

# Swap is in zram, with no seek to amortise: the default swap readahead of 8 pages only decompresses pages nobody asked for.
vm.page-cluster = 0
