# systemd-coredump keeps up to 1 GiB per crash and 10% of the disk in total, and one QEMU dump
# plus a few browser dumps filled /var/lib/systemd/coredump to 2 GiB. A crash that is bigger than
# the per-process limit is still logged (and reaches the error store); only its dump is dropped.
[Coredump]
MaxUse=2G
ProcessSizeMax=256M
ExternalSizeMax=256M
