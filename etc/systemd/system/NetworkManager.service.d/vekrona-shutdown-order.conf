# NetworkManager asks D-Bus for nm-dispatcher and wpa_supplicant while it shuts down, after systemd has already stopped
# them, and dbus-broker logs "Activation request for ... failed". Ordering NetworkManager after both makes it stop first.
[Unit]
Wants=NetworkManager-dispatcher.service wpa_supplicant.service
After=NetworkManager-dispatcher.service wpa_supplicant.service
