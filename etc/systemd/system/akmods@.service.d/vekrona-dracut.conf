# vekrona: kernel-install builds the initramfs before akmods@<kver> has built nvidia; redo it afterwards, then make the kernel the GRUB default
[Service]
# lib/common.sh, which vekrona-kernel-ready sources, insists on HOME, and a system unit has none
Environment=HOME=/root
ExecStartPost=/usr/local/lib/vekrona/libexec/vekrona-kernel-ready %i
