# tor is not enabled at boot: vekrona-tor-browser starts it with Tor Browser and stops it after (energy). It bypasses the VPN
# through an ip rule that vekrona-tor-route.service holds for as long as tor runs.
[Unit]
Requires=vekrona-tor-route.service
After=vekrona-tor-route.service

[Service]
# Makes /run/tor-tb (owner toranon, an ACL for the group vekrona-tor on it and on the sockets in it, SELinux type tor_var_run_t).
# The +-prefixed step runs with full privileges, outside the sandbox below.
ExecStartPre=+/usr/local/lib/vekrona/libexec/vekrona-tor-prepare
# tor writes its socket there. The - skips the path for the steps that run before the +-step has made it (the unit's own
# ExecStartPre, if it has one, runs first and is sandboxed).
ReadWritePaths=-/run/tor-tb
