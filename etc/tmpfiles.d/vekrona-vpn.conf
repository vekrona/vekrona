# /run/vekrona-vpn and its state.json exist from boot, in the disarmed state vekrona-vpn-apply publishes (lib/vekrona_vpn.py:
# state_text(DISARMED), mode 0644 as write_atomic writes it, in a 0755 directory), so the shell's FileView watches a file that
# is there when it starts instead of one whose parent directory appears later. Root only: dracut copies /etc/tmpfiles.d into the
# initramfs, and `f` leaves a file that already holds an arm alone.
d /run/vekrona-vpn 0755 root root -
f /run/vekrona-vpn/state.json 0644 root root - {"schema": 1, "armed": false, "uuid": null}
