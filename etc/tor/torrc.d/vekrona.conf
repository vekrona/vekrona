# Read by Fedora's /etc/tor/torrc (its %include). tor runs only while Tor Browser does (vekrona-tor-browser starts and
# stops tor.service), and Tor Browser has no network of its own: its Flatpak reaches tor through the socket below.

# The socket sits in a directory of its own, /run/vekrona-tor (made by libexec/vekrona-tor-prepare: toranon's, with an ACL for the group
# vekrona-tor, since tor accepts a group-accessible socket directory only when its group is tor's own), which the sandbox binds
# whole, so a tor restart's new socket is still seen.
SocksPort unix:/run/vekrona-tor/socks GroupWritable
# No TCP port: the launcher's download, made by `vekrona-tor-browser run`, reaches this socket through a relay in its own sandbox
# (lib/vekrona_tor_launch.py), so nothing on the host listens for a local program to use around the kill switch.
# Relays are reached over IPv6 too, which dual-stack and IPv6-only networks need.
ClientUseIPv6 1

# Fedora's torrc and defaults-torrc turn group access to tor's control socket, cookie and data directory on. The group that
# the session user joins is vekrona-tor, never toranon, and /run/tor is toranon's alone, but a later change must not hand
# the session tor's control port by accident. These lines must come after Fedora's own: stage 70 reads tor's effective
# configuration and fails if they do not win.
ControlSocketsGroupWritable 0
CookieAuthFileGroupReadable 0
DataDirectoryGroupReadable 0
