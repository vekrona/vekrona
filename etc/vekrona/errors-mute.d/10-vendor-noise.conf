[[mute]]
identifier = "kernel"
message = 'virt/tdx: TDX not supported by the host platform'
reason = "The kernel logs this at err priority on every machine without Intel TDX. It reports a missing optional CPU feature, not a fault."

[[mute]]
identifier = "greetd"
message = 'gkr-pam: unable to locate daemon control file'
reason = "Stock /etc/pam.d/greetd runs pam_gnome_keyring in the auth phase before any keyring daemon exists. The module stashes the password, and its session phase then starts gnome-keyring-daemon and unlocks the login keyring. See docs/known-issues.md."

# HP OMEN 45L BIOS F.18: the ACPI tables reference a SystemCMOS region the kernel has no handler for.
[[mute]]
identifier = "kernel"
message = 'ACPI Error: No handler for Region \[VRTC\] \([0-9a-f]+\) \[SystemCMOS\] \(\d+/evregion-\d+\)'
reason = "HP OMEN 45L BIOS F.18 declares a SystemCMOS operation region (VRTC) the kernel does not handle. Firmware bug, logged at every boot."

[[mute]]
identifier = "kernel"
message = 'ACPI Error: Region SystemCMOS \(ID=5\) has no handler \(\d+/exfldio-\d+\)'
reason = "Same HP OMEN 45L BIOS F.18 SystemCMOS region as the VRTC line. Firmware bug."

[[mute]]
identifier = "kernel"
message = 'ACPI Error: Aborting method \\_SB\.ACDC\.(?:RTWT|_GRT) due to previous error \(AE_NOT_EXIST\) \(\d+/psparse-\d+\)'
reason = "Follow-up of the missing SystemCMOS handler: the ACDC real-time clock methods abort. HP OMEN 45L BIOS F.18 firmware bug."

[[mute]]
identifier = "kernel"
message = 'ACPI BIOS Error \(bug\): AE_AML_BUFFER_LIMIT, Index \(0x000000050\) is beyond end of object \(length 0x50\) \(\d+/exoparg2-\d+\)'
reason = "HP OMEN 45L BIOS F.18 AML indexes one past the end of a 0x50-byte buffer. Firmware bug, logged at every boot."

[[mute]]
identifier = "kernel"
message = 'ACPI Error: Aborting method \\_SB\.WMID\.(?:WQBZ|WQBE) due to previous error \(AE_AML_BUFFER_LIMIT\) \(\d+/psparse-\d+\)'
reason = "Follow-up of the AE_AML_BUFFER_LIMIT bug in the HP OMEN 45L BIOS F.18 WMI methods. Firmware bug."

[[mute]]
identifier = "kernel"
message = 'kernel logged an error-priority journal entry whose MESSAGE is empty\.'
reason = "The initrd logs an error-priority kernel entry with an empty MESSAGE on every boot, so there is nothing to diagnose. The watcher titles it 'kernel: empty error message' and uses this text as its summary."

[[mute]]
identifier = "bluetoothd"
message = 'Failed to set mode: Failed \(0x03\)'
reason = "bluetoothd powers the adapter on at start-up even while rfkill blocks it (the Bluetooth toggle off). The kernel refuses with a generic Failed status; turning Bluetooth on later powers the adapter normally."

[[mute]]
identifier = "bluetoothd"
message = 'Failed to add device (?:[0-9A-F]{2}:){5}[0-9A-F]{2} \([0-2]\): Failed \(0x03\)'
reason = "Same start-up as 'Failed to set mode': bluetoothd registers each bonded device with a controller rfkill keeps down, and the kernel refuses because the controller is not running. The kernel keeps the device's connection parameters and reconnects it once Bluetooth is turned on."

[[mute]]
identifier = "kernel"
message = 'Bluetooth: hci\d+: ACL packet for unknown connection handle \d+'
reason = "The controller delivers a data packet for a link the host already closed, seen minutes after a BLE gamepad connects. The kernel drops the packet; nothing breaks."

[[mute]]
identifier = "dbus-broker-launch"
message = "Activation request for '(?:org\\.bluez|org\\.freedesktop\\.(?:Avahi|nm_dispatcher|GeoClue2|Accounts))' failed\\."
reason = "Logged only at shutdown: a client asks for one of these system daemons right after shutdown stopped it, and systemd refuses start jobs during shutdown. A real start failure of the daemon is recorded as its own unit failure."

[[mute]]
identifier = "kernel"
message = 'usb [0-9.-]+: (?:cannot submit urb \d+, error -19: no device|Unable to submit urb #\d+: -19 at snd_usb_queue_pending_output_urbs)'
reason = "Error -19 (ENODEV): a USB audio interface was unplugged, or its hub dropped off the bus, while it streamed. The kernel reports the device gone; the disconnect itself is the event."

[[mute]]
identifier = "pipewire"
message = 'spa\.alsa: (?:hw:[^:]+: )?(?:snd_pcm_drop|snd_pcm_status error|sw_params|swparams|close failed): No such device'
reason = "PipeWire keeps a node for a USB audio device that was just unplugged until udev removes it, and every call on it fails with No such device. The storm ends when the node goes."

[[mute]]
identifier = "pipewire"
message = 'spa\.alsa: hw:[^:]+: snd_pcm_start: (?:Broken pipe|File descriptor in bad state)'
reason = "PipeWire restarts a USB audio stream after an underrun or after the device vanished; ALSA refuses the restart on a stream that has already failed. PipeWire recovers or drops the node."

[[mute]]
identifier = "(udev-worker)"
message = 'controlC\d+: /usr/lib/udev/rules\.d/78-sound-card\.rules:\d+ ATTR\{\.\./uevent\}="change": Could not chase sysfs attribute "[^"]+", ignoring: No such file or directory'
reason = "The sound card rule runs for a USB sound card that was already removed, so its sysfs node is gone. udev ignores it, and nothing is left to set up."

# This desktop's Genesys Logic hub (05e3:0610) intermittently fails to bring up the port of the MACROSILICON capture card.
[[mute]]
identifier = "kernel"
message = 'usb [0-9.-]+-port\d+: (?:Cannot enable\. Maybe the USB cable is bad\?|unable to enumerate USB device)'
reason = "Hardware: a USB port fails link training after a reset (bad cable, hub, power or device), so the device never appears. Software cannot fix it; reseat or replace the cable or hub."

[[mute]]
identifier = "systemd-logind"
message = 'Refusing suspend operation, sleep is inhibited by UID \d+/\S+, PID \d+/systemd-inhibit\.'
reason = "Caffeine (vekrona-caffeine) holds a sleep inhibitor on purpose, so logind refuses its own idle suspend, as designed. logind logs that refusal at err priority."

[[mute]]
identifier = "systemd-cryptsetup"
message = 'Specified device /dev/hidraw\d+ is not a FIDO2 device\.'
reason = "crypttab's fido2-device=auto makes systemd-cryptsetup probe every hidraw device, and any other HID device answers no. It then finds the security key and unlocks."

[[mute]]
identifier = "sshd-session"
message = 'error: kex_exchange_identification: read: Connection reset by peer'
reason = "A client opened the SSH port and closed it before the key exchange, as port scanners and health checks do. No login was attempted on that connection."
