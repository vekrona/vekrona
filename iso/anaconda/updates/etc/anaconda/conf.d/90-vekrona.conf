[User Interface]
hidden_spokes =
    UserSpoke
    PasswordSpoke
    DatetimeSpoke
    CustomPartitioningSpoke
    BlivetGuiSpoke

password_policies =
    root (quality 1, length 6)
    user (quality 1, length 6, empty)
    luks (quality 1, length 8)

[Storage]
default_scheme = BTRFS
luks_version = luks2

[Installation Target]
# The vekrona spoke's password becomes the LUKS passphrase; none of these
# would otherwise redact it before writing it to the installed system.
can_copy_input_kickstart = False
can_save_output_kickstart = False
can_save_installation_logs = False
